<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Scheduler">
  <!--
    The same mark as HQ, in this app's shape.

    HQ is the pine on a cream CIRCLE. This is the pine on a cream 4:5 TILE —
    the aspect ratio the whole app exists to protect, and the shape of every
    thumbnail in it. Side by side in a tab strip they read as two apps from the
    same place, which is the point; at 16px the silhouette alone tells them
    apart, which is the other point.

    The tree is HQ's paths unchanged, nudged up twelve units to sit centred in
    a taller frame. Copying rather than redrawing is deliberate: a mark that
    was "matched by eye" drifts the first time either app is touched.

    Fixed colours, no dark-mode variant. HQ does the same, because this is a
    mark of identity rather than a piece of interface — a logo that changes
    colour with the browser theme is not a logo.
  -->
  <rect x="56" y="6" width="400" height="500" rx="64" fill="#faf8f4" />

  <g transform="translate(0 -12)" stroke="#2a2723" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M226 148 L256 118 L286 148" />
    <path d="M206 198 L256 168 L306 198" />
    <path d="M188 252 L256 222 L324 252" />
    <path d="M170 306 L256 276 L342 306" />
    <path d="M152 360 L256 330 L360 360" />
    <path d="M256 112 V424" />
  </g>
</svg>
