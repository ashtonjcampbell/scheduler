name: Publish due posts

on:
  # The 15-minute timer is off: HQ posts to Instagram now (his yes,
  # 18 November 2026, SPEC-STUDIO 45 piece 9), and two posters could put the
  # same post up twice. It can still be run by hand from the Actions tab.
  workflow_dispatch:

# Never let two publish runs overlap: both could claim the same post and
# publish it twice. Queue them instead of cancelling, so no run is lost.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # A stuck Instagram API call should not burn a full six hours.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      - name: Publish
        working-directory: worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run publish
